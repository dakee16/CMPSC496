<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroTutor</title>
<!-- This file used to be the whole app: a login form and a tabbed
     student/teacher view on the retired style.css. Every part of it has been
     superseded - login.html is the entry gate and student.html /
     teacher.html are the real pages.

     It is kept only as a redirect because index.html is what a static server
     hands back for "/". Deleting it outright would turn the site's front door
     into a directory listing. The old markup is recoverable from git history
     if any of it is ever wanted again.

     The <meta refresh> is the fallback for a browser that runs no JS; the
     script fires first and uses replace() so the dead page never enters the
     back-button history. -->
<meta http-equiv="refresh" content="0; url=login.html">
<link rel="canonical" href="login.html">
<script>location.replace("login.html");</script>
<meta name="theme-color" content="#0b1120">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Was a Google Fonts link for Inter, which no page uses any more. The three
     faces the app actually runs on come in via ui.css's @import. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="page" style="display:grid; place-items:center; min-height:60vh">
    <p class="sub">Taking you to <a href="login.html">MicroTutor</a>…</p>
  </div>
</body>
</html>
