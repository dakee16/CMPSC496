<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=(localStorage.getItem("mt.theme")==="light"?"light":"dark")}catch(e){}</script>
<title>MicroTutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Same URL as ui.css's @import, so the faces start downloading in
     parallel with the stylesheet instead of waiting for it to parse.
     The @import stays the single source of truth; this is a head start. -->
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
  body{display:grid; place-items:center; padding:24px}
  .gate{width:min(440px,100%)}
  /* Same wordmark as the floating header, so the first screen and every screen
     after it are unmistakably the same product. */
  .mark{display:flex; align-items:center; gap:10px; margin-bottom:26px}
  .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--indigo-500);
             box-shadow:0 0 0 4px rgba(99,102,241,.16)}
  .mark span{font-family:var(--font-display); font-weight:700; font-size:14px;
             letter-spacing:.17em; text-transform:uppercase}

  /* Role choice reads as two glass slabs rather than a select menu:
     it is the only real decision on this screen, so it gets the weight. */
  .roles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px}
  .roles input{position:absolute; opacity:0; pointer-events:none}
  .roles label{
    display:block; margin:0; cursor:pointer;
    padding:16px 14px; border-radius:14px;
    background:rgba(26,35,56,.5);
    border:1px solid var(--glass-line);
    transition:var(--transition);
  }
  .roles label:hover{background:rgba(99,102,241,.1); border-color:rgba(129,140,248,.3)}
  .roles input:checked + label{
    background:linear-gradient(135deg,rgba(99,102,241,.24),rgba(79,70,229,.14));
    border-color:var(--indigo-500);
    box-shadow:0 6px 20px rgba(99,102,241,.22),var(--glass-lift);
  }
  .roles input:focus-visible + label{outline:2px solid var(--indigo-400); outline-offset:2px}
  .roles .ico{line-height:0; margin-bottom:10px; display:block;
              color:var(--indigo-400)}
  .roles .rt{font-size:14.5px; font-weight:600; color:var(--text-bright)}
  .roles .rd{font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.45}

  /* A standing caveat about the demo, not an error. It used to be amber all the
     way through, which made the loudest thing on the sign-in screen a sentence
     nobody needs to act on. Only the label keeps the colour now; the sentence
     itself is ordinary muted copy. */
  .note{margin-top:18px; padding:12px 14px; border-radius:11px;
        background:rgba(245,158,11,.06); border:1px solid rgba(251,191,36,.16);
        color:var(--text-muted); font-size:12.5px; line-height:1.55}
  .note strong{color:var(--amber-text); font-weight:600}
  form{margin:0}
</style>
</head>
<body>
<main class="gate">
  <div class="mark"><span class="dot"></span><span>MicroTutor</span></div>

  <div class="card">
    <p class="eyebrow">Sign in</p>
    <h1>Pick up where you left off</h1>
    <p class="sub">Step by step programming practice, graded by running your code.</p>

    <form id="gate" autocomplete="off">
      <div class="field">
        <label for="nm">Your name</label>
        <input type="text" id="nm" placeholder="Alex Rivera" required maxlength="60">
      </div>

      <div class="roles">
        <!-- SVG rather than the &#9679;/&#9632; dingbats these used to be: a
             geometric-shapes glyph falls back to a different face on every
             platform, so the two options were a filled circle and a filled
             square of visibly different weights and sizes. -->
        <input type="radio" name="role" id="r-student" value="student" checked>
        <label for="r-student">
          <span class="ico">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4 2 9l10 5 10-5z"/><path d="M6 11.5V17c0 1.7 2.7 3 6 3s6-1.3 6-3v-5.5"/>
            </svg>
          </span>
          <div class="rt">Student</div>
          <div class="rd">Work through an assignment one step at a time.</div>
        </label>

        <input type="radio" name="role" id="r-teacher" value="teacher">
        <label for="r-teacher">
          <span class="ico">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16v12H4z"/><path d="M2 20h20"/><path d="M8 9h8M8 12.5h5"/>
            </svg>
          </span>
          <div class="rt">Instructor</div>
          <div class="rd">Upload an assignment and prepare it for students.</div>
        </label>
      </div>

      <button type="submit" style="width:100%">Continue</button>
      <!-- assertive, not polite: this is a blocking validation error and the
           student cannot proceed until they hear it. -->
      <div id="err" role="alert" aria-live="assertive"></div>
    </form>

    <div class="note">
      <strong>Demo sign in.</strong> Anyone can pick either role and no password is
      checked. Sign in with a PSU email comes later, so do not put an assignment
      you need to keep private in here yet.
    </div>
  </div>
</main>

<script src="ui.js"></script>
<script>
  // A session already in progress skips the gate.
  const existing = Session.get();
  if (existing && existing.name) {
    location.replace(existing.role === "teacher" ? "teacher.html" : "student.html");
  }

  document.getElementById("gate").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("nm").value.trim();
    if (!name) {
      document.getElementById("err").innerHTML =
        '<div class="banner bad">Enter a name to continue.</div>';
      return;
    }
    const role = document.querySelector('input[name="role"]:checked').value;
    Session.set(name, role);
    location.href = role === "teacher" ? "teacher.html" : "student.html";
  });
</script>
</body>
</html>
