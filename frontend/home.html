<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroTutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
  body{display:grid; place-items:center; padding:24px}
  .gate{width:min(440px,100%)}
  .mark{display:flex; align-items:center; gap:11px; margin-bottom:26px}
  .mark .dot{width:11px;height:11px;border-radius:50%;background:var(--indigo-500);
             box-shadow:0 0 0 5px rgba(99,102,241,.18)}
  .mark span{font-weight:700; font-size:16px; letter-spacing:-.02em}

  /* Role choice reads as two glass slabs rather than a select menu:
     it is the only real decision on this screen, so it gets the weight. */
  .roles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px}
  .roles input{position:absolute; opacity:0; pointer-events:none}
  .roles label{
    display:block; margin:0; cursor:pointer;
    padding:16px 14px; border-radius:14px;
    background:rgba(26,31,61,.5);
    border:1px solid var(--glass-line);
    transition:var(--transition);
  }
  .roles label:hover{background:rgba(99,102,241,.1); border-color:rgba(129,140,248,.3)}
  .roles input:checked + label{
    background:linear-gradient(135deg,rgba(99,102,241,.24),rgba(79,70,229,.14));
    border-color:var(--indigo-500);
    box-shadow:0 6px 20px rgba(99,102,241,.22),var(--glass-lift);
  }
  .roles input:focus-visible + label{outline:2px solid var(--indigo-400); outline-offset:2px}
  .roles .ico{font-size:19px; line-height:1; margin-bottom:9px; display:block;
              color:var(--indigo-400)}
  .roles .rt{font-size:14.5px; font-weight:600; color:var(--text-bright)}
  .roles .rd{font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.45}

  .note{margin-top:18px; padding:12px 14px; border-radius:11px;
        background:rgba(245,158,11,.09); border:1px solid rgba(251,191,36,.2);
        color:var(--amber-text); font-size:12.5px; line-height:1.5}
  form{margin:0}
</style>
</head>
<body>
<main class="gate">
  <div class="mark"><span class="dot"></span><span>MicroTutor</span></div>

  <div class="card">
    <p class="eyebrow">Sign in</p>
    <h1>Pick up where you left off</h1>
    <p class="sub">Step by step programming practice, graded by running your code.</p>

    <form id="gate" autocomplete="off">
      <div class="field">
        <label for="nm">Your name</label>
        <input type="text" id="nm" placeholder="Alex Rivera" required maxlength="60">
      </div>

      <div class="roles">
        <input type="radio" name="role" id="r-student" value="student" checked>
        <label for="r-student">
          <span class="ico">&#9679;</span>
          <div class="rt">Student</div>
          <div class="rd">Work through an assignment one step at a time.</div>
        </label>

        <input type="radio" name="role" id="r-teacher" value="teacher">
        <label for="r-teacher">
          <span class="ico">&#9632;</span>
          <div class="rt">Instructor</div>
          <div class="rd">Upload an assignment and prepare it for students.</div>
        </label>
      </div>

      <button type="submit" style="width:100%">Continue</button>
      <div id="err"></div>
    </form>

    <div class="note">
      <strong>Demo sign in.</strong> Anyone can pick either role and no password is
      checked. Sign in with a PSU email comes later, so do not put an assignment
      you need to keep private in here yet.
    </div>
  </div>
</main>

<script src="ui.js"></script>
<script>
  // A session already in progress skips the gate.
  const existing = Session.get();
  if (existing && existing.name) {
    location.replace(existing.role === "teacher" ? "teacher.html" : "student.html");
  }

  document.getElementById("gate").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("nm").value.trim();
    if (!name) {
      document.getElementById("err").innerHTML =
        '<div class="banner bad">Enter a name to continue.</div>';
      return;
    }
    const role = document.querySelector('input[name="role"]:checked').value;
    Session.set(name, role);
    location.href = role === "teacher" ? "teacher.html" : "student.html";
  });
</script>
</body>
</html>
