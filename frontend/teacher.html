<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=(localStorage.getItem("mt.theme")==="dark"?"dark":"light")}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>Teacher dashboard · ACADIA</title>

<meta name="theme-color" content="#f5ebdd">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="teacher.css">
<link rel="stylesheet" href="refinements.css">
</head>
<body>
<main class="page">
  <div class="page-heading"><div><p class="eyebrow">Your teaching workspace</p><h1>Teacher dashboard</h1><p class="sub">See what to review with your class and which students may need a hand.</p></div></div>

  <section class="class-insights" aria-labelledby="classInsightsTitle">
    <div class="insight-toolbar">
      <div><h2 id="classInsightsTitle">Where the class needs help</h2><p class="hint">Based on students’ saved answers.</p></div>
      <div class="insight-controls"><label for="insightAssignment">Assignment</label><select id="insightAssignment" disabled><option value="">All assignments</option></select><button id="refreshInsights" class="ghost" type="button">Refresh</button></div>
    </div>
    <div id="insightNotice" role="status" aria-live="polite"></div>
    <div id="classInsights" aria-busy="true"><div class="insight-empty" role="status">Loading class insights…</div></div>
    <p class="insight-footnote" id="insightUpdated"></p>
  </section>

</main>
<script src="ui.js"></script>
<script src="cache.js"></script>
<script src="onboarding.js"></script>
<script src="teacher-insights.js"></script>

</body></html>
