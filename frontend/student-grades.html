<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("mt.theme")==="dark"?"dark":"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
  <title>My grades · ACADIA</title>
  <meta name="theme-color" content="#f3f7f7">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="student-insights.css">
</head>
<body data-student-view="grades">
  <main class="page insights-page" id="mainContent">
    <div class="page-heading insights-heading">
      <div><p class="eyebrow">YOUR EFFORT, MADE VISIBLE</p><h1>Every step counts.</h1><p class="sub">See your grades, understand each result, and find your next opportunity.</p></div>
      <div class="insights-tools"><span id="updatedAt"></span><button class="ghost" id="refreshProgress" type="button">Refresh</button></div>
    </div>
    <div id="progressNotice" role="status" aria-live="polite"></div>
    <div id="insights" aria-busy="true"><div class="insights-loading" role="status">Loading your grades…</div></div>
  </main>
  <script src="ui.js"></script>
  <script src="student-insights.js"></script>
</body>
</html>
