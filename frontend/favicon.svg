<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark's dot, on the page ground. Same mark at 16px as at 14pt.
       Colours are literals because an SVG file cannot read tokens.css. -->
  <rect width="32" height="32" rx="8" fill="#0b1120"/>
  <circle cx="16" cy="16" r="6" fill="#818cf8"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#6366f1" stroke-opacity=".35" stroke-width="2"/>
</svg>
