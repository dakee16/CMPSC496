# Shared login limiter, spend caps, model memo, teacher watch channels and the
# fleet rate limit (main/shared.py). Same settings as docker-compose.scale.yml.
# Persisted, because the spend caps must survive a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: acadia-redis
  labels:
    app.kubernetes.io/name: acadia-redis
    acadia.io/tier: data
spec:
  serviceName: acadia-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acadia-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acadia-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-ttl", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 768Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: acadia-redis
  labels:
    acadia.io/tier: data
spec:
  selector:
    app.kubernetes.io/name: acadia-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
