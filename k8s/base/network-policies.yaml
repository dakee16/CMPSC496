# Who may talk to whom. k3s enforces these out of the box; on another cluster,
# check the CNI does, or they are silently decorative.

# The runner holds student code. Only the app may call it, and it may call
# nothing at all: no DNS, no Supabase, no OpenAI, no cloud metadata endpoint.
# The same fence as `runner-net: internal` in docker-compose.scale.yml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acadia-runner-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: acadia-runner
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              acadia.io/runner-client: "true"
      ports:
        - port: 8100
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acadia-redis-clients
  labels:
    acadia.io/tier: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: acadia-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              acadia.io/redis-client: "true"
      ports:
        - port: 6379
          protocol: TCP
