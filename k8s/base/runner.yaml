# Student code execution (main/runner_service.py), scaled apart from the web
# tier. It gets the runner token and nothing else: no app secrets, no service
# account, and no network out (network-policies.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acadia-runner
  labels:
    app.kubernetes.io/name: acadia-runner
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: acadia-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acadia-runner
      annotations:
        acadia.io/config-checksum: __CONFIG_SHA__
    spec:
      automountServiceAccountToken: false
      # Service-discovery variables would hand a student's program a map of
      # the cluster. The harness scrubs its child's environment anyway.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "main.runner_service:app", "--host", "0.0.0.0", "--port", "8100"]
          ports:
            - name: http
              containerPort: 8100
          env:
            - name: MICROTUTOR_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: acadia-generated
                  key: MICROTUTOR_RUNNER_TOKEN
            # Concurrent runs per pod, each up to 512 MB (main/execution.py).
            - name: MICROTUTOR_MAX_RUNS
              value: "4"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          # exec, not httpGet: the network policy shuts this pod to everyone
          # but the app, and loopback is the one path no CNI interferes with.
          readinessProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=4)"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8100/health', timeout=8)"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: acadia-runner
spec:
  selector:
    app.kubernetes.io/name: acadia-runner
  ports:
    - name: http
      port: 8100
      targetPort: http
---
# Student programs are CPU-bound, so CPU is the honest signal here.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: acadia-runner
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: acadia-runner
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: acadia-runner
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: acadia-runner
